# Render Blueprint — UPSC Brain Map
#
# Deploys the app as ONE web service (Express API + built React frontend)
# connected to a Neon Postgres database (free tier) via DATABASE_URL.
#
# Deploy: connect this repo at https://dashboard.render.com/blueprints/new
#
# Notes:
# - Elasticsearch is OPTIONAL. Search transparently falls back to Postgres
#   ILIKE when ES is unreachable. To enable it, set ES_URL to a hosted cluster
#   (e.g. Elastic Cloud, Bonsai).
# - Uploaded screenshots are stored on the local filesystem, which is ephemeral
#   on the free plan (wiped on every redeploy). See the commented options below
#   for persisting them.

version: "1"

services:
  - type: web
    name: upsc-brainmap
    runtime: node
    rootDir: backend
    plan: free
    # Build the frontend into frontend/dist (served by Express) during deploy.
    buildCommand: npm install && npx playwright install --with-deps chromium && cd ../frontend && npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      # Skip Playwright's default all-browsers download during `npm install`;
      # we install only Chromium explicitly in buildCommand instead.
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      # Neon (free) Postgres connection string. Paste it in the Render dashboard
      # when prompted for this secret. It looks like:
      #   postgresql://USER:PASSWORD@ep-xxxx.region.aws.neon.tech/neondb?sslmode=require
      # (Keep the trailing ?sslmode=require — the app enables TLS automatically.)
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_BACKEND
        value: local
      # Secrets — paste these in the Render dashboard when prompted:
      # - DEEPSEEK_API_KEY powers AI Q&A + AI map generation.
      # - GEMINI_API_KEY powers AI Q&A + AI map generation (alternative model).
      # - OPENAI_API_KEY powers note-text extraction (falls back to local OCR).
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Auth (NEW — required for accounts/sign-in):
      # - JWT_SECRET: a long random string that signs login tokens. REQUIRED
      #   for the accounts feature; without it a public default is used.
      # - GOOGLE_CLIENT_ID: your Google OAuth "Web application" Client ID
      #   (for "Sign in with Google"). Optional — email/password still works
      #   without it.
      # - VITE_GOOGLE_CLIENT_ID: the SAME Google Client ID, embedded into the
      #   frontend at build time for the Google button. Set it here (Render
      #   exposes env vars during the build step too).
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      # Optional: hosted Elasticsearch for full-text search.
      # - key: ES_URL
      #   value: https://your-es-cluster:9200
      # Optional: persist screenshots on a Render persistent disk (paid plan).
      # - key: STORAGE_LOCAL_DIR
      #   value: /var/data/storage
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 5

# This app uses an external Neon Postgres database (free tier), so there is no
# managed Render database. If you'd rather use Render's managed Postgres instead,
# swap the DATABASE_URL secret above for a fromDatabase reference and uncomment:
#
# databases:
#   - name: upsc-db
#     plan: free
#     databaseName: upsc
#     user: upsc
